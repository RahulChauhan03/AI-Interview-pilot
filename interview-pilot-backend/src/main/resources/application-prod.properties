# Production profile: activate with SPRING_PROFILES_ACTIVE=prod.
# Every value below is required from the environment; there are no localhost fallbacks.
spring.datasource.url=${DB_URL}
spring.data.mongodb.uri=${MONGODB_URI}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Comma-separated list of exact frontend origins, e.g. https://app.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL}

# Full URL of Ollama's generate API, e.g. http://ollama-host:11434/api/generate
resume.ollama.endpoint=${OLLAMA_ENDPOINT}
