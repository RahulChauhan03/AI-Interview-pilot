# Local development profile (the default when no profile is set).
# Secrets come from environment variables or from a git-ignored .env file in the folder the
# app is started from (interview-pilot-backend/). Start from application-example.properties.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/interview_pilot_db
spring.data.mongodb.uri=mongodb://localhost:27017/interview_pilot_ai

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=http://localhost:4200
app.frontend.reset-password-url=http://localhost:4200/reset-password

resume.ollama.endpoint=${OLLAMA_ENDPOINT:http://localhost:11434/api/generate}
