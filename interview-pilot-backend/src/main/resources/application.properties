spring.application.name=interview-pilot-backend

# Profiles: "dev" is used unless SPRING_PROFILES_ACTIVE is set (production sets it to "prod").
# Environment-specific URLs live in application-dev.properties / application-prod.properties.
spring.profiles.default=dev

# Secrets are required environment variables with no defaults: startup fails if one is missing.
# See application-example.properties for the full list.

# MySQL (URL is set per profile)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — Flyway owns the MySQL schema; Hibernate only verifies that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway (MySQL only; MongoDB is not managed by Flyway)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# A database created by the old ddl-auto=create setup already matches V1 but has no
# flyway_schema_history table. Start the app ONCE with FLYWAY_BASELINE_ON_MIGRATE=true to
# record it at version 1 without running V1. Keep it false otherwise, so Flyway refuses to
# run against an unknown non-empty schema instead of silently baselining it.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Pre-Flyway schema created by Hibernate
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Server
server.port=8080

# Authentication: JWT_SECRET is a base64-encoded key of at least 32 bytes (openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Password-reset email. Gmail requires a Google App Password for the account in MAIL_USERNAME.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${spring.mail.username}}
app.password-reset.token-expiration-minutes=30
app.password-reset.request-cooldown-seconds=60

# Resume processing
resume.storage.path=${RESUME_STORAGE_PATH:uploads/resume}
resume.max-file-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ollama (resume.ollama.endpoint is set per profile)
resume.ollama.model=${OLLAMA_MODEL:llama3.2:1b}
resume.ollama.temperature=0.1
# Cap on generated tokens. A complete analysis is ~1,500 tokens; without a cap a small model can get stuck
# repeating itself, and Ollama keeps generating even after the client has timed out.
resume.ollama.max-output-tokens=${OLLAMA_MAX_OUTPUT_TOKENS:3000}
# Context window (prompt + answer). Ollama's default is too small for a resume plus a job description.
resume.ollama.context-tokens=${OLLAMA_CONTEXT_TOKENS:8192}
# Interview questions use a higher temperature so a new session does not repeat the previous questions.
interview.ai.question-temperature=0.7
resume.ollama.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:5s}
# Upper bound for one full resume analysis. llama3.2 on a laptop CPU needs ~4 minutes per resume and
# Ollama handles one request at a time, so a queued request waits for the one before it.
# A GPU server can use a much lower value.
resume.ollama.read-timeout=${OLLAMA_READ_TIMEOUT:10m}

# Retry only when the request never reached Ollama (connection refused/timeout) or Ollama returned HTTP 5xx:
# at most 3 attempts in total. Read timeouts are not retried.
resilience4j.retry.instances.ollama.max-attempts=3
resilience4j.retry.instances.ollama.wait-duration=2s
resilience4j.retry.instances.ollama.retry-exceptions=com.interviewpilot.exception.OllamaUnavailableException
# Stop calling Ollama for a while when at least half of the recent calls failed.
resilience4j.circuitbreaker.instances.ollama.sliding-window-size=10
resilience4j.circuitbreaker.instances.ollama.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ollama.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ollama.wait-duration-in-open-state=60s

# Recovery: resumes left UPLOADED or PROCESSING for longer than this are queued again.
# Keep it above the worst-case processing time (read-timeout plus a few seconds of connection retries).
resume.processing.stale-after-minutes=15
resume.processing.recovery-interval-minutes=5
