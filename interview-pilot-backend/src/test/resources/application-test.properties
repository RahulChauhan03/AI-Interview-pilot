# Test profile, activated for every test by the surefire configuration in pom.xml.
# Tests must never touch the development database (interview_pilot_db) or real accounts:
# they use their own databases (created on first run) and dummy credentials.
# Only DB_USERNAME / DB_PASSWORD come from the environment or the git-ignored .env file.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/interview_pilot_test?createDatabaseIfNotExist=true}
spring.data.mongodb.uri=${TEST_MONGODB_URI:mongodb://localhost:27017/interview_pilot_test}

# Test-only values, not secrets.
app.jwt.secret=aGlyZWZsb3ctdGVzdC1vbmx5LWp3dC1rZXktbm90LWEtcmVhbC1zZWNyZXQtMDAwMA==
spring.mail.username=tests@example.invalid
spring.mail.password=not-used
app.cors.allowed-origins=http://localhost:4200
app.frontend.reset-password-url=http://localhost:4200/reset-password
resume.ollama.endpoint=http://localhost:11434/api/generate
resume.storage.path=target/test-uploads
