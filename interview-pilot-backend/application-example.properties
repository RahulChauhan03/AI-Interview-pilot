# Template for the environment variables the backend needs. Contains NO real values.
#
# Local development: copy this file to .env in this folder (it is git-ignored) and fill it in:
#   cp application-example.properties .env
# The dev profile reads .env automatically; real environment variables take precedence.
#
# Production: set these as real environment variables on the server, plus SPRING_PROFILES_ACTIVE=prod.

# --- Required in every environment ---
DB_USERNAME=your_database_user
DB_PASSWORD=your_database_password
# Base64-encoded, at least 32 bytes. Generate with: openssl rand -base64 48
JWT_SECRET=your_long_random_base64_secret
MAIL_USERNAME=your_email
MAIL_PASSWORD=your_app_password

# --- Required in production only (dev uses localhost values) ---
# DB_URL=jdbc:mysql://your-db-host:3306/interview_pilot_db
# MONGODB_URI=mongodb://your-mongo-host:27017/interview_pilot_ai
# CORS_ALLOWED_ORIGINS=https://your-frontend-domain
# FRONTEND_RESET_PASSWORD_URL=https://your-frontend-domain/reset-password
# OLLAMA_ENDPOINT=http://your-ollama-host:11434/api/generate

# --- Optional (defaults shown) ---
# MAIL_HOST=smtp.gmail.com
# MAIL_PORT=587
# MAIL_FROM=same as MAIL_USERNAME
# RESUME_STORAGE_PATH=uploads/resume
# OLLAMA_ENDPOINT=http://localhost:11434/api/generate   (dev default)
# OLLAMA_MODEL=llama3.2:1b
# OLLAMA_MAX_OUTPUT_TOKENS=3000
# OLLAMA_CONNECT_TIMEOUT=5s
# OLLAMA_READ_TIMEOUT=10m
