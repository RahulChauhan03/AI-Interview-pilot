<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HireFlow — AI Career &amp; Interview Assistant</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved theme before Angular starts, so the page never flashes the wrong theme (see ThemeService).
      (function () {
        try {
          var mode = localStorage.getItem('ip-theme');
          document.documentElement.style.colorScheme = mode === 'light' || mode === 'dark' ? mode : 'light dark';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
