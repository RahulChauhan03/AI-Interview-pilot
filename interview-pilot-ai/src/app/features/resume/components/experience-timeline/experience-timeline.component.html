<div class="timeline"><article *ngFor="let item of entries(); let last = last"><i></i><div class="timeline-card"><div class="top"><div><h3>{{ value(item, 'company', 'companyName', 'organization') }}</h3><p>{{ value(item, 'designation', 'title', 'role') }}</p></div><span>{{ value(item, 'duration', 'dates', 'employmentDates') }}</span></div><p class="location">{{ value(item, 'location', 'city') }}</p><ul *ngIf="list(item, 'responsibilities', 'description').length"><li *ngFor="let responsibility of list(item, 'responsibilities', 'description')">{{ responsibility }}</li></ul><mat-chip-set *ngIf="list(item, 'technologies', 'techStack', 'skills').length"><mat-chip *ngFor="let technology of list(item, 'technologies', 'techStack', 'skills')">{{ technology }}</mat-chip></mat-chip-set></div></article></div>
