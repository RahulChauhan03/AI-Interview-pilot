<header><div class="file"><div class="file-icon"><mat-icon>description</mat-icon></div><div><h1>{{ resume().originalFileName }}</h1><div class="meta"><mat-chip>AI Parsed</mat-chip><span><mat-icon>star</mat-icon>ATS score {{ score() }}</span><span>Uploaded {{ resume().uploadTime | date:'MMM d' }}</span><span *ngIf="resume().processingTime">{{ resume().processingTime! / 1000 | number:'1.0-1' }} sec processing</span></div></div></div><div class="actions"><button mat-stroked-button disabled matTooltip="A download endpoint is not available yet"><mat-icon>download</mat-icon>Download</button><button mat-stroked-button disabled matTooltip="Re-parsing is not available yet"><mat-icon>refresh</mat-icon>Refresh</button><button mat-icon-button aria-label="Close resume intelligence" (click)="close.emit()"><mat-icon>close</mat-icon></button></div></header>
