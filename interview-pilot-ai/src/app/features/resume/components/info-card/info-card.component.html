<article class="info-card"><mat-icon>{{ icon() }}</mat-icon><div><small>{{ label() }}</small><a *ngIf="href()" [href]="href()" target="_blank" rel="noopener">{{ value() }}</a><strong *ngIf="!href()">{{ value() || 'Not provided' }}</strong></div><button *ngIf="value() && !href()" mat-icon-button aria-label="Copy value" (click)="copy()"><mat-icon>content_copy</mat-icon></button></article>
