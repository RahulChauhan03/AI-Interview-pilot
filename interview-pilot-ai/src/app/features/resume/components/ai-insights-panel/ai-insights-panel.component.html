<aside class="insights" [class.collapsed]="!expanded()"><button mat-button class="toggle" (click)="expanded.set(!expanded())"><span><mat-icon>auto_awesome</mat-icon>AI resume insights</span><mat-icon>{{ expanded() ? 'expand_less' : 'expand_more' }}</mat-icon></button><div class="body" *ngIf="expanded()"><div class="score"><div><b>{{ score() }}</b><span>/100</span></div><p>ATS readiness score</p></div><div><h4>Strengths</h4><mat-chip-set><mat-chip *ngFor="let item of strengths()">{{ item }}</mat-chip></mat-chip-set><p *ngIf="!strengths().length">No strengths detected.</p></div><div><h4>Recommendations</h4><ul *ngIf="recommendations().length"><li *ngFor="let item of recommendations()">{{ item }}</li></ul><p *ngIf="!recommendations().length">Profile coverage looks complete.</p></div><div><h4>Detected roles</h4><mat-chip-set><mat-chip *ngFor="let role of roles()">{{ role }}</mat-chip></mat-chip-set><p *ngIf="!roles().length">No role detected.</p></div></div></aside>
